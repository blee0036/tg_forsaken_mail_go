name: Dependency security maintenance

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

concurrency:
  group: dependency-security-maintenance
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  scan-and-upgrade:
    name: Scan and upgrade vulnerable Go dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan and apply fixed versions
        id: upgrade
        shell: bash
        run: |
          set -euo pipefail

          report="$RUNNER_TEMP/govulncheck-before.json"
          govulncheck -C cmd/bot -scan=module -json > "$report"

          declare -A upgrades=()
          while IFS='@' read -r module version; do
            if [[ -n "$module" && -n "$version" ]]; then
              upgrades["$module"]="$version"
            fi
          done < <(
            jq -r '
              select(.finding != null)
              | .finding as $finding
              | ($finding.trace[0] // {}) as $vulnerable
              | select(
                  ($vulnerable.module // "") != ""
                  and $vulnerable.module != "stdlib"
                  and $vulnerable.module != "go-version-rewrite"
                  and ($finding.fixed_version // "") != ""
                )
              | "\($vulnerable.module)@\($finding.fixed_version)"
            ' "$report" | sort -t@ -k1,1 -k2,2V
          )

          for module in "${!upgrades[@]}"; do
            echo "Upgrading $module to ${upgrades[$module]}"
            go get "$module@${upgrades[$module]}"
          done

          stdlib_fix="$({
            jq -r '
              select(.finding != null)
              | .finding as $finding
              | select(
                  (($finding.trace[0].module // "") == "stdlib")
                  and (($finding.fixed_version // "") != "")
                )
              | $finding.fixed_version
            ' "$report" | sed 's/^v//' | sort -V | tail -n 1
          } || true)"

          if [[ -n "$stdlib_fix" ]]; then
            # The database may report a fix on an older Go release line.
            # Choose the latest supported stable release, never downgrade.
            latest_go="$(curl --fail --silent --show-error --location 'https://go.dev/dl/?mode=json' \
              | jq -er '[.[] | select(.stable)] | first | .version | ltrimstr("go")')"
            current_go="$(awk '$1 == "go" {print $2}' go.mod)"
            newest="$(printf '%s\n' "$current_go" "$latest_go" | sort -V | tail -n 1)"
            if [[ "$newest" != "$current_go" ]]; then
              echo "Upgrading the Go toolchain requirement to $newest"
              go mod edit -go="$newest"
            fi
          fi

          go mod tidy
          go_version="$(awk '$1 == "go" {print $2}' go.mod)"
          sed -i "s/^ARG GO_VERSION=.*/ARG GO_VERSION=${go_version}/" Dockerfile
          # A Go upgrade can require rebuilding the scanner with the new SDK.
          export GOTOOLCHAIN="go${go_version}+auto"
          echo "GOTOOLCHAIN=go${go_version}+auto" >> "$GITHUB_ENV"
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

          if git diff --quiet -- go.mod go.sum Dockerfile; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests after upgrades
        if: steps.upgrade.outputs.changed == 'true'
        run: |
          go test -race -count=1 ./...
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/mail-bot" ./cmd/bot

      - name: Verify vulnerabilities are fixed
        run: govulncheck -C cmd/bot -scan=module

      - name: Create dependency security pull request
        if: steps.upgrade.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/dependency-security-updates
          delete-branch: true
          add-paths: |
            go.mod
            go.sum
            Dockerfile
          commit-message: 'chore(deps): upgrade vulnerable Go dependencies'
          title: 'chore(deps): upgrade vulnerable Go dependencies'
          body: |
            Automated security maintenance generated by `govulncheck`.

            The workflow applies the fixed versions reported by the Go vulnerability database, runs the full test suite, and verifies the updated dependency graph before opening this PR.
