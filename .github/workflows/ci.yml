name: Go tests and vulnerability checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests and static checks
        run: |
          go test -race ./...
          go vet ./...

      - name: Build deployment binary without CGO
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/mail-bot" ./cmd/bot

      - name: Scan deployment modules and the Go standard library
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          "$(go env GOPATH)/bin/govulncheck" -C cmd/bot -scan=module
